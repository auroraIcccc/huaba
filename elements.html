<!-- Cusdis iframe 自动高度修复 -->


<script>


window.addEventListener("message", function(event){



	// 只接受 Cusdis 消息

	if(event.origin !== "https://cusdis.com"){

		return;

	}




	const iframe = 
	document.querySelector("#cusdis_thread iframe");



	if(!iframe){

		return;

	}





	try{


		const data =

			typeof event.data === "string"

			?

			JSON.parse(event.data)

			:

			event.data;




		if(data && data.event === "resize"){



			const height =

				parseInt(data.data);



			if(height > 0){


				iframe.style.height =

					height + "px";


				iframe.style.overflow =

					"hidden";


			}


		}


	}

	catch(e){


		console.log(
			"Cusdis resize error:",
			e
		);


	}



});







// 防止首次加载高度异常


setTimeout(function(){



	const iframe =

		document.querySelector("#cusdis_thread iframe");



	if(iframe){


		iframe.style.minHeight =

			"500px";


	}



},2000);



</script>
